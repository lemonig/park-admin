name: park_nextjs - Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:   # 手动触发测试用

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: park-nextjs

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 新增：注入前端后端API地址
          build-args: |
            NEXT_PUBLIC_API_URL=http://36.151.148.156:3429

      # 与 park-java 相同的自动部署：SSH 到服务器拉取新镜像并重建容器
      - name: Deploy to JD Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            IMAGE=sixnut/park-nextjs
            TAG=latest
            # 先拉取成功才动旧容器，避免部署失败导致服务中断
            docker pull $IMAGE:$TAG
            # nginx 代理的是宿主机 3000 端口
            docker rm -f park-nextjs 2>/dev/null || true
            docker run -d \
              --name park-nextjs \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /data/park/logs/nextjs:/app/logs \
              -e NEXT_PUBLIC_API_URL=http://36.151.148.156:3429 \
              $IMAGE:$TAG
            docker image prune -f