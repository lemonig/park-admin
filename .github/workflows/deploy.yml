name: park_nextjs - Build and Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:   # 手动触发测试用

env:
  REGISTRY: crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com
  # 前端镜像与后端 park-java 同命名空间：park_java/park-admin-web
  IMAGE: crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-admin-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      # 与后端一致用原生 docker build/push：buildx 默认附加的 provenance 认证清单与阿里云个人版不兼容
      - name: Build and push
        run: |
          IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-admin-web
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      # 与 park-java 相同的自动部署：SSH 到京东云，从 ACR 拉取新镜像并重建容器。
      # GitHub 海外节点 SSH 到国内服务器偶发被链路重置，故最多重试 5 次
      - name: Deploy to JD Cloud
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > /tmp/deploy-remote.sh <<'REMOTE'
          set -e
          IMAGE=crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com/park_java/park-admin-web
          TAG=latest

          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login crpi-66pjm0oi7g763epj.cn-hangzhou.personal.cr.aliyuncs.com \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

          # 先拉取成功才动旧容器，避免部署失败导致服务中断
          docker pull $IMAGE:$TAG

          # nginx 代理的是宿主机 3000 端口
          docker rm -f park-nextjs 2>/dev/null || true

          # API 地址是 Next 服务运行时 rewrites 读取的，必须在 docker run 时以环境变量注入
          docker run -d \
            --name park-nextjs \
            --restart unless-stopped \
            -p 3000:3000 \
            -v /data/park/logs/nextjs:/app/logs \
            -e NEXT_PUBLIC_API_URL=http://36.151.148.156:3429 \
            $IMAGE:$TAG

          docker image prune -f
          REMOTE

          ok=0
          for i in 1 2 3 4 5; do
            echo "===== 第 $i 次部署尝试 ====="
            if ssh -i ~/.ssh/deploy_key \
                 -o StrictHostKeyChecking=accept-new \
                 -o ConnectTimeout=20 \
                 -o ServerAliveInterval=10 \
                 "$SSH_USER@$SSH_HOST" 'bash -s' < /tmp/deploy-remote.sh; then
              ok=1
              break
            fi
            echo "第 $i 次尝试失败，60 秒后重试..."
            [ "$i" = "5" ] || sleep 60
          done
          [ "$ok" = "1" ] || { echo "5 次尝试均失败，放弃部署"; exit 1; }
